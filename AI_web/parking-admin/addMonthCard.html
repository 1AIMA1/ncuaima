<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>增加月卡 - 园区后台管理系统</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="layout">

        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="logo-bar">
                <span class="logo">HEIMAZS</span>
            </div>
            <nav class="menu">
                <div class="menu-item" data-key="index" data-href="index.html">
                    <span class="menu-icon"></span>
                    <span class="menu-text">工作台</span>
                </div>

                <div class="menu-item has-sub">
                    <span class="menu-icon"></span>
                    <span class="menu-text">园区管理</span>
                    <span class="menu-arrow"></span>
                </div>
                <ul class="submenu">
                    <!-- <li class="submenu-item" data-href="#">区域管理</li>后期添加 -->
                </ul>

                <div class="menu-item has-sub">
                    <span class="menu-icon"></span>
                    <span class="menu-text">行车管理</span>
                    <span class="menu-arrow"></span>
                </div>
                <ul class="submenu">
                    <li class="submenu-item" data-href="#">区域管理</li>
                    <li class="submenu-item" data-key="monthCard" data-href="monthCard.html">月卡管理</li>
                    <li class="submenu-item" data-href="#">停车缴费管理</li>
                    <li class="submenu-item" data-href="#">计费规则管理</li>
                </ul>

                <div class="menu-item has-sub">
                    <span class="menu-icon"></span>
                    <span class="menu-text">物业费管理</span>
                    <span class="menu-arrow"></span>
                </div>
                <ul class="submenu"></ul>

                <div class="menu-item has-sub">
                    <span class="menu-icon"></span>
                    <span class="menu-text">一体杆管理</span>
                    <span class="menu-arrow"></span>
                </div>
                <ul class="submenu"></ul>

                <div class="menu-item has-sub">
                    <span class="menu-icon"></span>
                    <span class="menu-text">系统管理</span>
                    <span class="menu-arrow"></span>
                </div>
                <ul class="submenu"></ul>
            </nav>
        </aside>

        <!-- 右侧主区 -->
        <section class="main">
            <header class="header">
                <span class="user-info">黑马管理员</span>
            </header>

            <div class="content">

                <!-- ===== 返回条 + 标题 ===== -->
                <div class="page-head">
                    <button type="button" class="btn" id="btn-back">&larr; 返回</button>
                    <span class="page-title" id="pageTitle">新增月卡</span>
                </div>

                <!-- ===== 车辆信息表单卡片 ===== -->
                <div class="card">
                    <div class="form-section-title">车辆信息</div>
                    <div class="form-grid">
                        <div class="form-item">
                            <label class="form-label">车主姓名<span class="req">*</span></label>
                            <input type="text" id="ownerName" class="ipt" placeholder="请输入车主姓名">
                        </div>
                        <div class="form-item">
                            <label class="form-label">手机号<span class="req">*</span></label>
                            <input type="text" id="phone" class="ipt" placeholder="请输入手机号">
                        </div>
                        <div class="form-item">
                            <label class="form-label">车牌号<span class="req">*</span></label>
                            <input type="text" id="carNumber" class="ipt" placeholder="如：赣A12345">
                        </div>
                        <div class="form-item">
                            <label class="form-label">车型品牌</label>
                            <input type="text" id="carBrand" class="ipt" placeholder="如：丰田凯美瑞">
                        </div>
                    </div>
                </div>

                <!-- ===== 缴费信息表单卡片 ===== -->
                <div class="card">
                    <div class="form-section-title">缴费信息</div>
                    <div class="form-grid">
                        <div class="form-item">
                            <label class="form-label">开始日期<span class="req">*</span></label>
                            <input type="date" id="startDate" class="ipt">
                        </div>
                        <div class="form-item">
                            <label class="form-label">结束日期<span class="req">*</span></label>
                            <input type="date" id="endDate" class="ipt">
                        </div>
                        <div class="form-item">
                            <label class="form-label">缴费金额(元)<span class="req">*</span></label>
                            <input type="number" id="payAmount" class="ipt" min="0" placeholder="请输入缴费金额">
                        </div>
                        <div class="form-item">
                            <label class="form-label">剩余有效天数</label>
                            <input type="text" id="remainDay" class="ipt" disabled placeholder="确定后自动计算">
                        </div>
                    </div>
                    <div class="form-err" id="formErr"></div>

                    <div class="form-actions">
                        <button type="button" class="btn" id="btn-reset">重置</button>
                        <button type="button" class="btn btn-primary" id="btn-submit">确定</button>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <!-- 数据层 + 公共布局 + 页面业务 -->
    <script src="js/dataStore.js"></script>
    <script src="js/common.js"></script>
    <script src="js/addMonthCard.js"></script>
</body>
</html>
